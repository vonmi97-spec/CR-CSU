name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compiler l'APK
        run: gradle assembleRelease --no-daemon
      - name: Renommer
        run: cp app/build/outputs/apk/release/app-release.apk CR-CSU.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CR-CSU-apk
          path: CR-CSU.apk
      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: CR CSU v1.0.${{ github.run_number }}
          files: CR-CSU.apk
