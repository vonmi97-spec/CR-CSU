<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a2c2e">
<title>CR CSU</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="bar">
    <div class="bar-left" id="barLeft"></div>
    <div class="bar-title" id="barTitle">CR</div>
    <div class="bar-right" id="barRight"></div>
  </header>
  <main id="view"></main>
  <nav id="tabs">
    <button data-tab="cr" class="tab"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M12 6.5V12l3.5 2.5"/></svg><span>Comptes-rendus</span></button>
    <button data-tab="export" class="tab"><svg viewBox="0 0 24 24"><path d="M4 19c2-6 6-9 12-9V6l5 5.5-5 5.5v-4c-5 0-9 1.5-12 5.5z" class="fill"/></svg><span>Exporter</span></button>
    <button data-tab="plan" class="tab"><svg viewBox="0 0 24 24" stroke-linejoin="round"><path d="M3 6.5l6-2.5 6 2.5 6-2.5v13.5l-6 2.5-6-2.5-6 2.5z"/><path d="M9 4v13.5M15 6.5V20"/></svg><span>Plan</span></button>
    <button data-tab="settings" class="tab"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>Paramètres</span></button>
    <button data-tab="about" class="tab"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M12 10.5v7M12 7v.5" stroke-width="2.4"/></svg><span>À propos</span></button>
  </nav>
</div>
<div id="modalRoot"></div>
<input type="file" id="fileGallery" accept="image/*,video/*" hidden>
<input type="file" id="filePhoto" accept="image/*" capture="environment" hidden>
<input type="file" id="fileVideo" accept="video/*" capture="environment" hidden>
<input type="file" id="fileRestore" accept=".json,application/json,*/*" hidden>
<script src="rues.js"></script>
<script src="app.js"></script>
<datalist id="dlRues"></datalist>
</body>
</html>
